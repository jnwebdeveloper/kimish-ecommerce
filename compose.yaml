services:
  postgres:
    image: postgres:16-alpine
    container_name: kimish-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - kimish_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kimish -d kimish']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kimish_database:
